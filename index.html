<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>翻牌消消乐</title>
<style>
/* === CSS 变量：日系清新主题 === */
:root {
  --primary: #81C784;
  --primary-light: #A5D6A7;
  --primary-dark: #66BB6A;
  --bg-start: #e8f5e9;
  --bg-end: #fafafa;
  --card-shadow: rgba(0, 0, 0, 0.08);
  --text-main: #333;
  --text-sub: #888;
  --white: #fff;
}

/* === 基础重置 === */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
  background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 20px 16px 40px;
  color: var(--text-main);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

/* === 主容器 === */
.game-container {
  width: 100%;
  max-width: 520px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
}

/* === 标题 === */
.game-title {
  font-size: 32px;
  font-weight: 700;
  color: var(--primary-dark);
  letter-spacing: 4px;
  margin-top: 12px;
}

/* === 难度选择 === */
.difficulty-bar {
  display: flex;
  gap: 12px;
}

.diff-btn {
  padding: 8px 24px;
  border: 2px solid var(--primary-light);
  background: var(--white);
  color: var(--primary);
  border-radius: 24px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s;
}

.diff-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(129, 199, 132, 0.2);
}

.diff-btn.active {
  background: var(--primary);
  color: var(--white);
  border-color: var(--primary);
}

/* === 棋盘 === */
.board {
  display: grid;
  gap: 10px;
  width: 100%;
  max-width: 480px;
  perspective: 800px;
}

/* 默认 6 列，JS 动态覆盖 */
.board.cols-4 { grid-template-columns: repeat(4, 1fr); }
.board.cols-6 { grid-template-columns: repeat(6, 1fr); }

/* === 底部按钮 === */
.btn-restart {
  padding: 12px 36px;
  border: 1.5px dashed var(--primary-light);
  background: transparent;
  color: var(--primary);
  border-radius: 24px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s;
}

.btn-restart:hover {
  border-color: var(--primary);
  color: var(--primary-dark);
  transform: translateY(-2px);
}

.btn-restart:active {
  transform: scale(0.96);
}

/* === 通关弹窗 === */
.win-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  z-index: 100;
  align-items: center;
  justify-content: center;
}

.win-overlay.active {
  display: flex;
}

.win-card {
  background: var(--white);
  border-radius: 24px;
  padding: 40px 32px 32px;
  text-align: center;
  box-shadow: 0 16px 48px rgba(0, 0, 0, 0.12);
  max-width: 340px;
  width: 90%;
  animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

@keyframes popIn {
  from { transform: scale(0.8); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.win-emoji {
  font-size: 56px;
  margin-bottom: 12px;
}

.win-title {
  font-size: 26px;
  font-weight: 700;
  color: var(--primary-dark);
  margin-bottom: 8px;
}

.win-subtitle {
  font-size: 15px;
  color: var(--text-sub);
  margin-bottom: 24px;
}

/* === 分享按钮 === */
.btn-share {
  background: none;
  color: var(--primary);
  border: 1.5px dashed var(--primary-light);
  padding: 12px 28px;
  border-radius: 24px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  width: 100%;
  margin-bottom: 12px;
}

.btn-share:hover {
  border-color: var(--primary);
  color: var(--primary-dark);
}

.btn-share:active {
  transform: scale(0.96);
}

.btn-replay {
  background: var(--primary);
  color: var(--white);
  border: none;
  padding: 12px 28px;
  border-radius: 24px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  width: 100%;
}

.btn-replay:active {
  transform: scale(0.96);
}

/* === 卡片 === */
.card {
  aspect-ratio: 1;
  perspective: 600px;
  cursor: pointer;
}

.card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform 0.4s ease;
  transform-style: preserve-3d;
}

.card.flipped .card-inner {
  transform: rotateY(180deg);
}

.card-front,
.card-back {
  position: absolute;
  inset: 0;
  border-radius: 14px;
  backface-visibility: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 卡片正面（未翻开） */
.card-front {
  background: var(--white);
  border: 2px solid var(--primary-light);
  box-shadow: 0 2px 8px var(--card-shadow);
  font-size: 28px;
  color: var(--primary-light);
  font-weight: 700;
}

.card-front:hover {
  box-shadow: 0 4px 16px rgba(129, 199, 132, 0.2);
  border-color: var(--primary);
}

/* 卡片背面（翻开后显示 emoji） */
.card-back {
  background: var(--white);
  border: 2px solid var(--primary-light);
  transform: rotateY(180deg);
  font-size: 36px;
}

/* 已匹配消除的卡片 */
.card.matched {
  pointer-events: none;
}

.card.matched .card-inner {
  transform: rotateY(180deg) scale(0.85);
  opacity: 0.5;
  transition: transform 0.5s ease, opacity 0.5s ease;
}

/* 匹配成功的脉冲动画 */
@keyframes matchPulse {
  0%   { box-shadow: 0 0 0 0 rgba(129, 199, 132, 0.5); }
  70%  { box-shadow: 0 0 0 16px rgba(129, 199, 132, 0); }
  100% { box-shadow: 0 0 0 0 rgba(129, 199, 132, 0); }
}

.card.match-highlight .card-back {
  animation: matchPulse 0.8s ease;
  border-color: var(--primary);
}

/* 匹配失败短暂震动 */
@keyframes shakeBrief {
  0%, 100% { transform: rotateY(180deg) translateX(0); }
  25%      { transform: rotateY(180deg) translateX(-4px); }
  75%      { transform: rotateY(180deg) translateX(4px); }
}

.card.mismatch .card-inner {
  animation: shakeBrief 0.4s ease;
}

/* === 分享遮罩 === */
.share-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.85);
  z-index: 200;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.share-overlay.active {
  display: flex;
}

.share-card-img {
  max-width: 90vw;
  max-height: 70vh;
  border-radius: 16px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
  object-fit: contain;
}

.share-hint {
  color: #ccc;
  font-size: 14px;
  margin-top: 16px;
  text-align: center;
  opacity: 0.85;
}

.share-close {
  color: #ccc;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.25);
  padding: 10px 32px;
  border-radius: 24px;
  font-size: 15px;
  cursor: pointer;
  margin-top: 16px;
}
</style>
</head>
<body>
<div class="game-container">
  <h1 class="game-title">🍀 翻牌消消乐</h1>

  <div class="difficulty-bar" id="difficulty-bar">
    <button class="diff-btn" data-diff="easy">简单</button>
    <button class="diff-btn active" data-diff="normal">普通</button>
    <button class="diff-btn" data-diff="hard">困难</button>
  </div>

  <div class="board cols-6" id="board"></div>

  <button class="btn-restart" id="btn-restart">🔄 重新开始</button>
</div>

<!-- 通关弹窗 -->
<div class="win-overlay" id="win-overlay">
  <div class="win-card">
    <div class="win-emoji">🎉</div>
    <div class="win-title">恭喜通关！</div>
    <div class="win-subtitle" id="win-subtitle">你成功消除了所有卡片</div>
    <button class="btn-share" id="btn-share">📤 分享给朋友</button>
    <button class="btn-replay" id="btn-replay">🔄 再来一局</button>
  </div>
</div>

<!-- 分享卡片遮罩 -->
<div class="share-overlay" id="share-overlay">
  <img class="share-card-img" id="share-card-img" src="" alt="分享卡片">
  <p class="share-hint">长按图片保存，发到微信群</p>
  <button class="share-close" id="share-close">关闭</button>
</div>

<script>
// === 配置 ===
const SHARE_URL = ''; // 部署后填写实际 URL

const DIFFICULTY = {
  easy:   { label: '简单', cols: 4, rows: 4, pairs: 8 },
  normal: { label: '普通', cols: 6, rows: 4, pairs: 12 },
  hard:   { label: '困难', cols: 6, rows: 6, pairs: 18 },
};

const EMOJI_POOL = [
  '🍎', '🍊', '🍋', '🍇', '🍓', '🌸', '🌻', '🍀',
  '🐶', '🐱', '🐰', '🦊', '🐼', '🐨', '🐸', '🦋',
  '🐝', '🌈', '⭐', '🔥', '🎵', '🍕', '🎸', '🚀',
];

// === 游戏状态 ===
const GAME = {
  difficulty: 'normal',
  cards: [],       // { emoji: string, flipped: boolean, matched: boolean }
  firstCard: null, // 索引
  secondCard: null,
  isLocked: false,
};

// === DOM 引用 ===
const boardEl = document.getElementById('board');
const diffBtns = document.querySelectorAll('.diff-btn');

// === 工具函数：Fisher-Yates 洗牌 ===
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// === 创建卡片数组 ===
function createCards() {
  const config = DIFFICULTY[GAME.difficulty];
  // 从 emoji 池随机选取所需配对数
  const picked = shuffle(EMOJI_POOL).slice(0, config.pairs);
  // 每对两个，打乱顺序
  const doubled = shuffle([...picked, ...picked]);
  return doubled.map(emoji => ({
    emoji,
    flipped: false,
    matched: false,
  }));
}

// === 渲染棋盘 ===
function renderBoard() {
  const config = DIFFICULTY[GAME.difficulty];
  boardEl.className = `board cols-${config.cols}`;
  boardEl.innerHTML = '';

  GAME.cards.forEach((card, index) => {
    const cardEl = document.createElement('div');
    cardEl.className = 'card';
    cardEl.dataset.index = index;
    if (card.flipped) cardEl.classList.add('flipped');
    if (card.matched) cardEl.classList.add('matched');

    cardEl.innerHTML = `
      <div class="card-inner">
        <div class="card-front">?</div>
        <div class="card-back">${card.emoji}</div>
      </div>
    `;

    cardEl.addEventListener('click', () => handleCardClick(index, cardEl));
    boardEl.appendChild(cardEl);
  });
}

// === 新游戏 ===
function newGame() {
  GAME.cards = createCards();
  GAME.firstCard = null;
  GAME.secondCard = null;
  GAME.isLocked = false;
  renderBoard();
}

// === 翻牌事件处理 ===
function handleCardClick(index, cardEl) {
  const card = GAME.cards[index];

  // 忽略：已匹配、已翻开、正在锁定中
  if (card.matched || card.flipped || GAME.isLocked) return;
  // 忽略：点击同一张牌
  if (GAME.firstCard === index) return;

  // 翻开当前牌
  card.flipped = true;
  cardEl.classList.add('flipped');

  if (GAME.firstCard === null) {
    // 第一张牌
    GAME.firstCard = index;
  } else {
    // 第二张牌
    GAME.secondCard = index;
    GAME.isLocked = true;

    checkMatch();
  }
}

// === 检查匹配 ===
function checkMatch() {
  const first = GAME.cards[GAME.firstCard];
  const second = GAME.cards[GAME.secondCard];

  if (first.emoji === second.emoji) {
    // 匹配成功
    onMatchSuccess();
  } else {
    // 匹配失败
    onMatchFail();
  }
}

// === 匹配成功 ===
function onMatchSuccess() {
  const firstIdx = GAME.firstCard;
  const secondIdx = GAME.secondCard;
  const firstEl = document.querySelector(`.card[data-index="${firstIdx}"]`);
  const secondEl = document.querySelector(`.card[data-index="${secondIdx}"]`);

  GAME.cards[firstIdx].matched = true;
  GAME.cards[secondIdx].matched = true;

  // 高亮动画
  firstEl.classList.add('match-highlight');
  secondEl.classList.add('match-highlight');

  // 动画结束后标记为 matched
  setTimeout(() => {
    firstEl.classList.add('matched');
    secondEl.classList.add('matched');
    firstEl.classList.remove('match-highlight');
    secondEl.classList.remove('match-highlight');
    resetSelection();
    checkWin();
  }, 600);
}

// === 匹配失败 ===
function onMatchFail() {
  const firstIdx = GAME.firstCard;
  const secondIdx = GAME.secondCard;
  const firstEl = document.querySelector(`.card[data-index="${firstIdx}"]`);
  const secondEl = document.querySelector(`.card[data-index="${secondIdx}"]`);

  firstEl.classList.add('mismatch');
  secondEl.classList.add('mismatch');

  // 0.6s 后翻回
  setTimeout(() => {
    GAME.cards[firstIdx].flipped = false;
    GAME.cards[secondIdx].flipped = false;
    firstEl.classList.remove('flipped', 'mismatch');
    secondEl.classList.remove('flipped', 'mismatch');
    resetSelection();
  }, 600);
}

// === 重置选牌 ===
function resetSelection() {
  GAME.firstCard = null;
  GAME.secondCard = null;
  GAME.isLocked = false;
}

// === 检查是否通关 ===
function checkWin() {
  const allMatched = GAME.cards.every(card => card.matched);
  if (!allMatched) return;

  // 延迟弹出，让最后两张牌的消除动画播完
  setTimeout(() => {
    showWin();
  }, 400);
}

// === 显示通关弹窗 ===
function showWin() {
  const config = DIFFICULTY[GAME.difficulty];
  document.getElementById('win-subtitle').textContent =
    `你成功消除了全部 ${config.pairs} 对卡片！`;
  document.getElementById('win-overlay').classList.add('active');
}

// === 暴露 newGame 到全局，供按钮调用 ===
window.newGame = newGame;

// === 难度切换 ===
diffBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    const diff = btn.dataset.diff;
    if (diff === GAME.difficulty) return;

    // 更新 UI
    diffBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    // 更新状态并重开
    GAME.difficulty = diff;
    document.getElementById('win-overlay').classList.remove('active');
    newGame();
  });
});

// === 按钮事件绑定 ===
document.getElementById('btn-restart').addEventListener('click', () => {
  // 关闭通关弹窗（如果打开着）
  document.getElementById('win-overlay').classList.remove('active');
  newGame();
});

// === 通关弹窗按钮 ===
document.getElementById('btn-replay').addEventListener('click', () => {
  document.getElementById('win-overlay').classList.remove('active');
  newGame();
});

// === 启动游戏 ===
newGame();
</script>
</body>
</html>
